<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Przemysłowy Panel Alarmowy</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #2a2a2a;
        font-family: 'Arial', sans-serif;
    }

    .panel-casing {
        width: 90vw;
        max-width: 1000px;
        height: 80vh;
        max-height: 600px;
        background: linear-gradient(135deg, #e0e5ec 0%, #a3abb5 100%);
        border-radius: 15px;
        box-shadow: 
            0 20px 50px rgba(0,0,0,0.8),
            inset 0 5px 10px rgba(255,255,255,0.8),
            inset 0 -5px 15px rgba(0,0,0,0.2);
        border: 4px solid #88929e;
        display: flex;
        padding: 30px;
        box-sizing: border-box;
        gap: 30px;
    }

    /* Lewa strona - Wyświetlacz LCD */
    .left-section {
        flex: 1.2;
        display: flex;
        flex-direction: column;
        background: #111;
        padding: 20px;
        border-radius: 10px;
        box-shadow: inset 0 0 20px #000;
        border: 2px solid #444;
    }

    .lcd-screen {
        flex: 1;
        background-color: #9ea776; 
        border: inset 6px #222;
        border-radius: 5px;
        padding: 20px;
        /* Cyfrowa czcionka */
        font-family: 'VT323', monospace;
        color: #1e261d;
        font-size: 42px;
        line-height: 1.2;
        text-transform: uppercase;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
        text-shadow: 2px 2px 0px rgba(158, 167, 118, 0.4);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
    }

    .lcd-screen::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.05),
            rgba(0,0,0,0.05) 2px,
            transparent 2px,
            transparent 4px
        );
        pointer-events: none;
    }

    #lcd-status {
        white-space: pre-line;
    }

    .lcd-input-area {
        border-top: 2px dashed #1e261d;
        padding-top: 10px;
    }

    /* Prawa strona - Fizyczne przyciski zawsze widoczne */
    .right-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #cfd4db;
        padding: 20px;
        border-radius: 10px;
        border: 2px solid #b0b8c4;
        box-shadow: inset 0 2px 5px rgba(255,255,255,0.8), inset 0 -2px 5px rgba(0,0,0,0.1);
    }

    /* Górny panel ikon alarmowych */
    .emergency-panel {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
    }

    .icon-btn {
        flex: 1;
        font-size: 50px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.1s ease;
    }

    .btn-fire {
        background: linear-gradient(to bottom, #e34040 0%, #a61212 100%);
        box-shadow: 0 8px 0 #5e0808, 0 10px 15px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.4);
    }
    .btn-fire:active { transform: translateY(8px); box-shadow: 0 0 0 #5e0808, 0 2px 5px rgba(0,0,0,0.6), inset 0 4px 6px rgba(0,0,0,0.6); }

    .btn-intruder {
        background: linear-gradient(to bottom, #3b71cc 0%, #17428c 100%);
        box-shadow: 0 8px 0 #09214d, 0 10px 15px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.4);
    }
    .btn-intruder:active { transform: translateY(8px); box-shadow: 0 0 0 #09214d, 0 2px 5px rgba(0,0,0,0.6), inset 0 4px 6px rgba(0,0,0,0.6); }

    /* Klawiatura numeryczna */
    .numpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        flex: 1;
    }

    .btn-physical {
        background: linear-gradient(to bottom, #5a5f66 0%, #3e4247 100%);
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 
            0 8px 0 #1f2124, 
            0 10px 15px rgba(0,0,0,0.6),
            inset 0 2px 2px rgba(255,255,255,0.3);
        transition: all 0.1s ease;
        text-shadow: 0 -1px 0 black;
    }

    .btn-physical:active {
        transform: translateY(8px);
        box-shadow: 
            0 0 0 #1f2124, 
            0 2px 5px rgba(0,0,0,0.6),
            inset 0 4px 6px rgba(0,0,0,0.4);
    }

    .btn-clear { background: linear-gradient(to bottom, #d69838 0%, #a86e16 100%); box-shadow: 0 8px 0 #6b440a, 0 10px 15px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.3); }
    .btn-clear:active { box-shadow: 0 0 0 #6b440a, 0 2px 5px rgba(0,0,0,0.6), inset 0 4px 6px rgba(0,0,0,0.4); }

    .btn-enter { background: linear-gradient(to bottom, #4c9e4c 0%, #2e702e 100%); box-shadow: 0 8px 0 #184218, 0 10px 15px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.3); }
    .btn-enter:active { box-shadow: 0 0 0 #184218, 0 2px 5px rgba(0,0,0,0.6), inset 0 4px 6px rgba(0,0,0,0.4); }

    @keyframes blink {
        0% { background-color: #9ea776; color: #1e261d; }
        50% { background-color: #1e261d; color: #9ea776; }
        100% { background-color: #9ea776; color: #1e261d; }
    }
    .flashing {
        animation: blink 0.5s infinite;
    }

</style>
</head>
<body>

<div class="panel-casing">
    
    <div class="left-section">
        <div id="lcd" class="lcd-screen">
            <div id="lcd-status">SYSTEM GOTOWY<br><br>CZEKAM NA AKCJE...</div>
            <div class="lcd-input-area">
                PIN: <span id="pin-display">_ _ _ _</span>
            </div>
        </div>
    </div>

    <div class="right-section">
        
        <div class="emergency-panel">
            <button class="icon-btn btn-fire" onclick="triggerAlarm('POZAR')" title="Pożar">🔥</button>
            <button class="icon-btn btn-intruder" onclick="triggerAlarm('WLAMANIE')" title="Włamanie">🥷</button>
        </div>

        <div class="numpad">
            <button class="btn-physical" onclick="pressKey('1')">1</button>
            <button class="btn-physical" onclick="pressKey('2')">2</button>
            <button class="btn-physical" onclick="pressKey('3')">3</button>
            <button class="btn-physical" onclick="pressKey('4')">4</button>
            <button class="btn-physical" onclick="pressKey('5')">5</button>
            <button class="btn-physical" onclick="pressKey('6')">6</button>
            <button class="btn-physical" onclick="pressKey('7')">7</button>
            <button class="btn-physical" onclick="pressKey('8')">8</button>
            <button class="btn-physical" onclick="pressKey('9')">9</button>
            <button class="btn-physical btn-clear" onclick="clearPin()">C</button>
            <button class="btn-physical" onclick="pressKey('0')">0</button>
            <button class="btn-physical btn-enter" onclick="submitPin()">OK</button>
        </div>

    </div>

</div>

<script>
    let currentPin = '';
    const correctPin = '4556';
    let isAlarmActive = false;
    
    const lcd = document.getElementById('lcd');
    const lcdStatus = document.getElementById('lcd-status');
    const pinDisplay = document.getElementById('pin-display');

    function updateDisplay() {
        let dispText = '';
        for(let i=0; i<4; i++) {
            if(i < currentPin.length) dispText += '* ';
            else dispText += '_ ';
        }
        pinDisplay.innerText = dispText.trim();
    }

    function pressKey(num) {
        if (currentPin.length < 4) {
            currentPin += num;
            updateDisplay();
        }
    }

    function clearPin() {
        currentPin = '';
        updateDisplay();
    }

    function submitPin() {
        if (currentPin === correctPin) {
            // Zatrzymanie alarmu lub udane logowanie
            isAlarmActive = false;
            lcd.classList.remove('flashing');
            lcdStatus.innerHTML = "AUTORYZACJA OK<br><br>SYSTEM ZRESETOWANY<br>I GOTOWY.";
            currentPin = '';
            updateDisplay();
            
            // Po 3 sekundach powrót do domyślnego tekstu
            setTimeout(() => {
                if(!isAlarmActive) {
                    lcdStatus.innerHTML = "SYSTEM GOTOWY<br><br>CZEKAM NA AKCJE...";
                }
            }, 3000);

        } else {
            // Zły PIN
            const previousText = lcdStatus.innerHTML;
            lcdStatus.innerHTML = "BŁĄD AUTORYZACJI!<br><br>NIEPOPRAWNY PIN.";
            currentPin = '';
            updateDisplay();

            // Powrót do poprzedniego ekranu po 2 sekundach
            setTimeout(() => {
                // Jeśli alarm wyje, przywracamy tekst alarmowy, jeśli nie - standardowy
                if(isAlarmActive) {
                    lcdStatus.innerHTML = previousText; 
                } else {
                    lcdStatus.innerHTML = "SYSTEM GOTOWY<br><br>CZEKAM NA AKCJE...";
                }
            }, 2000);
        }
    }

    function triggerAlarm(type) {
        isAlarmActive = true;
        lcd.classList.add('flashing');
        currentPin = '';
        updateDisplay();
        
        if(type === 'POZAR') {
            lcdStatus.innerHTML = "!!! ALARM !!!<br><br>WYKRYTO POŻAR<br>TRWA EWAKUACJA";
        } else if (type === 'WLAMANIE') {
            lcdStatus.innerHTML = "!!! ALARM !!!<br><br>NARUSZENIE STREFY<br>WEZWANO OCHRONĘ";
        }
    }
</script>
</body>
</html>
