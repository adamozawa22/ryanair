<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Alarmowy - Retro Style</title>
<style>
    /* Ogólne style i tło nawiązujące do starego iOS */
    body {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: #5b626d;
        background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
    }

    /* Kontener imitujący ekran telefonu */
    .phone-container {
        width: 320px;
        height: 480px;
        background: #111;
        border-radius: 30px;
        padding: 60px 15px;
        box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.2);
        position: relative;
        overflow: hidden;
    }

    /* Obszar roboczy ekranu */
    .screen {
        width: 100%;
        height: 100%;
        background: #ced5e0;
        position: relative;
        display: flex;
        flex-direction: column;
        border: 2px solid #000;
    }

    /* Pasek tytułowy (Top Bar) */
    .top-bar {
        background: linear-gradient(to bottom, #aeb9ce 0%, #7d8ea8 50%, #687b9b 51%, #6d80a1 100%);
        border-bottom: 1px solid #2e3542;
        text-align: center;
        padding: 10px 0;
        font-weight: bold;
        font-size: 18px;
        color: white;
        text-shadow: 0 -1px 0 rgba(0,0,0,0.7);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }

    /* --- EKRAN PIN --- */
    #pin-screen {
        display: flex;
    }

    .pin-display {
        background: white;
        color: black;
        margin: 20px;
        padding: 15px;
        text-align: center;
        font-size: 24px;
        letter-spacing: 10px;
        border-radius: 5px;
        border: 1px solid #777;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }

    .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 0 20px;
    }

    /* Szkliste przyciski (Glossy Buttons) */
    .btn {
        background: linear-gradient(to bottom, #ffffff 0%, #e5e5e5 50%, #cccccc 51%, #f4f4f4 100%);
        border: 1px solid #555;
        border-radius: 8px;
        padding: 15px 0;
        font-size: 20px;
        font-weight: bold;
        color: #333;
        text-shadow: 0 1px 0 rgba(255,255,255,0.8);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 2px 2px rgba(0,0,0,0.3);
        cursor: pointer;
    }

    .btn:active {
        background: linear-gradient(to bottom, #cccccc 0%, #aaaaaa 50%, #999999 51%, #cccccc 100%);
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }

    .btn-zero {
        grid-column: 2;
    }

    /* --- EKRAN PANELU STEROWANIA --- */
    #dashboard-screen {
        display: none;
        padding: 20px;
        flex-direction: column;
        gap: 20px;
    }

    .action-btn {
        width: 100%;
        padding: 15px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        text-align: center;
        border: 1px solid #000;
        text-shadow: 0 -1px 0 rgba(0,0,0,0.8);
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 3px 5px rgba(0,0,0,0.4);
    }

    /* Czerwony przycisk z obrazka */
    .btn-red {
        background: linear-gradient(to bottom, #f78d8d 0%, #e03232 50%, #cc0000 51%, #e51c1c 100%);
    }
    .btn-red:active { background: #990000; box-shadow: inset 0 3px 5px rgba(0,0,0,0.8); }

    /* Niebieski/Czarny przycisk z obrazka */
    .btn-dark {
        background: linear-gradient(to bottom, #7d8ea8 0%, #465a7a 50%, #304363 51%, #415575 100%);
    }
    .btn-dark:active { background: #203353; box-shadow: inset 0 3px 5px rgba(0,0,0,0.8); }

    /* --- ALERT OKIENKO (Z lewego górnego rogu obrazka) --- */
    .modal-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    .alert-box {
        background: linear-gradient(to bottom, #2c3a59 0%, #1a253f 100%);
        border: 2px solid #fff;
        border-radius: 8px;
        width: 80%;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .alert-title {
        color: white;
        font-size: 16px;
        font-weight: bold;
        padding: 15px 10px 5px;
        text-shadow: 0 -1px 0 #000;
    }

    .alert-text {
        color: white;
        font-size: 13px;
        padding: 0 10px 15px;
    }

    .alert-buttons {
        display: flex;
        justify-content: center;
        padding-bottom: 15px;
        gap: 10px;
    }

    .alert-btn {
        background: linear-gradient(to bottom, #6d80a1 0%, #415575 50%, #304363 51%, #465a7a 100%);
        border: 1px solid #111;
        border-radius: 5px;
        color: white;
        padding: 5px 15px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .alert-btn:active { background: #1a253f; }

</style>
</head>
<body>

<div class="phone-container">
    
    <div id="pin-screen" class="screen">
        <div class="top-bar">Wprowadź kod PIN</div>
        <div class="pin-display" id="display">_ _ _ _</div>
        
        <div class="keypad">
            <button class="btn" onclick="pressKey('1')">1</button>
            <button class="btn" onclick="pressKey('2')">2</button>
            <button class="btn" onclick="pressKey('3')">3</button>
            <button class="btn" onclick="pressKey('4')">4</button>
            <button class="btn" onclick="pressKey('5')">5</button>
            <button class="btn" onclick="pressKey('6')">6</button>
            <button class="btn" onclick="pressKey('7')">7</button>
            <button class="btn" onclick="pressKey('8')">8</button>
            <button class="btn" onclick="pressKey('9')">9</button>
            <button class="btn btn-zero" onclick="pressKey('0')">0</button>
        </div>
    </div>

    <div id="dashboard-screen" class="screen">
        <div class="top-bar">Panel Główny</div>
        <div style="color:#333; text-align:center; font-size:14px; margin-top:10px;">
            System Rozbrojony.<br>Wybierz akcję ratunkową:
        </div>
        
        <button class="action-btn btn-red" onclick="showAlert('ZAGROŻENIE POŻAROWE', 'Rozpoczęto procedurę ewakuacyjną i powiadomiono straż pożarną.')">
            Zagrożenie Pożarowe
        </button>
        
        <button class="action-btn btn-dark" onclick="showAlert('WŁAMANIE', 'Uruchomiono cichy alarm. Powiadomiono grupę interwencyjną.')">
            Zgłoś Włamanie
        </button>

        <button class="action-btn" style="background: linear-gradient(to bottom, #555 0%, #333 50%, #222 51%, #444 100%); margin-top: auto; margin-bottom: 20px;" onclick="logout()">
            Wyloguj (Zablokuj)
        </button>
    </div>

    <div id="alert-modal" class="modal-overlay">
        <div class="alert-box">
            <div class="alert-title" id="alert-title">Alert Label</div>
            <div class="alert-text" id="alert-text">Opis alertu...</div>
            <div class="alert-buttons">
                <button class="alert-btn" onclick="closeAlert()">Cancel</button>
                <button class="alert-btn" onclick="closeAlert()">Continue</button>
            </div>
        </div>
    </div>

</div>

<script>
    let currentPin = '';
    const correctPin = '4556';
    const displayElement = document.getElementById('display');
    const pinScreen = document.getElementById('pin-screen');
    const dashScreen = document.getElementById('dashboard-screen');
    const alertModal = document.getElementById('alert-modal');

    function updateDisplay() {
        // Pokazuje gwiazdki zamiast cyfr, reszta to podkreślniki
        let dispText = '';
        for(let i=0; i<4; i++) {
            if(i < currentPin.length) dispText += '* ';
            else dispText += '_ ';
        }
        displayElement.innerText = dispText.trim();
    }

    function pressKey(num) {
        if (currentPin.length < 4) {
            currentPin += num;
            updateDisplay();
        }

        // Sprawdzanie pinu, gdy wpisano 4 cyfry
        if (currentPin.length === 4) {
            setTimeout(() => {
                if (currentPin === correctPin) {
                    // Prawidłowy pin
                    pinScreen.style.display = 'none';
                    dashScreen.style.display = 'flex';
                } else {
                    // Błędny pin
                    alert('Nieprawidłowy kod PIN. Spróbuj ponownie.');
                }
                currentPin = '';
                updateDisplay();
            }, 200);
        }
    }

    function showAlert(title, message) {
        document.getElementById('alert-title').innerText = title;
        document.getElementById('alert-text').innerText = message;
        alertModal.style.display = 'flex';
    }

    function closeAlert() {
        alertModal.style.display = 'none';
    }

    function logout() {
        dashScreen.style.display = 'none';
        pinScreen.style.display = 'flex';
        currentPin = '';
        updateDisplay();
    }
</script>
</body>
</html>
