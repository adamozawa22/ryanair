<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Przemysłowy Panel Alarmowy</title>
<style>
    /* Tło ściany / otoczenia */
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #2a2a2a;
        font-family: 'Arial', sans-serif;
    }

    /* Główna obudowa panelu (Tablet Landscape) */
    .panel-casing {
        width: 90vw;
        max-width: 1000px;
        height: 80vh;
        max-height: 600px;
        background: linear-gradient(135deg, #e0e5ec 0%, #a3abb5 100%);
        border-radius: 15px;
        box-shadow: 
            0 20px 50px rgba(0,0,0,0.8),
            inset 0 5px 10px rgba(255,255,255,0.8),
            inset 0 -5px 15px rgba(0,0,0,0.2);
        border: 4px solid #88929e;
        display: flex;
        padding: 30px;
        box-sizing: border-box;
        gap: 30px;
    }

    /* Lewa strona - Wyświetlacz LCD */
    .left-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #111;
        padding: 20px;
        border-radius: 10px;
        box-shadow: inset 0 0 20px #000;
        border: 2px solid #444;
    }

    .lcd-screen {
        flex: 1;
        background-color: #9ea776; /* Klasyczna zieleń LCD */
        border: inset 6px #222;
        border-radius: 5px;
        padding: 20px;
        font-family: 'Courier New', Courier, monospace;
        color: #1e261d;
        font-size: 28px;
        font-weight: bold;
        text-transform: uppercase;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
        text-shadow: 1px 1px 0px rgba(158, 167, 118, 0.5); /* Efekt poświaty pikseli */
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        overflow: hidden;
    }

    /* Paski imitujące odświeżanie ekranu LCD */
    .lcd-screen::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(
            0deg,
            rgba(0,0,0,0.05),
            rgba(0,0,0,0.05) 2px,
            transparent 2px,
            transparent 4px
        );
        pointer-events: none;
    }

    /* Prawa strona - Fizyczne przyciski */
    .right-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #cfd4db;
        padding: 20px;
        border-radius: 10px;
        border: 2px solid #b0b8c4;
        box-shadow: inset 0 2px 5px rgba(255,255,255,0.8), inset 0 -2px 5px rgba(0,0,0,0.1);
    }

    /* --- Fizyczne Przyciski Klawiatury (Numpad) --- */
    .numpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        height: 100%;
    }

    .btn-physical {
        background: linear-gradient(to bottom, #5a5f66 0%, #3e4247 100%);
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        /* Potężny cień imitujący grubość przycisku */
        box-shadow: 
            0 8px 0 #1f2124, 
            0 10px 15px rgba(0,0,0,0.6),
            inset 0 2px 2px rgba(255,255,255,0.3);
        transition: all 0.1s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        text-shadow: 0 -1px 0 black;
    }

    .btn-physical:active {
        transform: translateY(8px);
        box-shadow: 
            0 0 0 #1f2124, 
            0 2px 5px rgba(0,0,0,0.6),
            inset 0 4px 6px rgba(0,0,0,0.4);
    }

    .btn-clear { background: linear-gradient(to bottom, #d69838 0%, #a86e16 100%); box-shadow: 0 8px 0 #6b440a, 0 10px 15px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.3); }
    .btn-clear:active { box-shadow: 0 0 0 #6b440a, 0 2px 5px rgba(0,0,0,0.6), inset 0 4px 6px rgba(0,0,0,0.4); }

    .btn-enter { background: linear-gradient(to bottom, #4c9e4c 0%, #2e702e 100%); box-shadow: 0 8px 0 #184218, 0 10px 15px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.3); }
    .btn-enter:active { box-shadow: 0 0 0 #184218, 0 2px 5px rgba(0,0,0,0.6), inset 0 4px 6px rgba(0,0,0,0.4); }

    /* --- Panel Akcji (Po Zalogowaniu) --- */
    .action-panel {
        display: none;
        flex-direction: column;
        gap: 20px;
        height: 100%;
        justify-content: center;
    }

    .btn-alarm {
        flex: 1;
        font-size: 24px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .btn-fire {
        background: linear-gradient(to bottom, #e34040 0%, #a61212 100%);
        box-shadow: 0 8px 0 #5e0808, 0 10px 15px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.4);
    }
    .btn-fire:active { box-shadow: 0 0 0 #5e0808, 0 2px 5px rgba(0,0,0,0.6), inset 0 4px 6px rgba(0,0,0,0.6); }

    .btn-intruder {
        background: linear-gradient(to bottom, #3b71cc 0%, #17428c 100%);
        box-shadow: 0 8px 0 #09214d, 0 10px 15px rgba(0,0,0,0.6), inset 0 2px 2px rgba(255,255,255,0.4);
    }
    .btn-intruder:active { box-shadow: 0 0 0 #09214d, 0 2px 5px rgba(0,0,0,0.6), inset 0 4px 6px rgba(0,0,0,0.6); }

    .btn-logout {
        flex: 0.5;
        font-size: 18px;
    }

    /* Animacja migania dla alertów */
    @keyframes blink {
        0% { background-color: #9ea776; color: #1e261d; }
        50% { background-color: #1e261d; color: #9ea776; }
        100% { background-color: #9ea776; color: #1e261d; }
    }
    .flashing {
        animation: blink 0.8s infinite;
    }

</style>
</head>
<body>

<div class="panel-casing">
    
    <div class="left-section">
        <div id="lcd" class="lcd-screen">
            SYSTEM ZABLOKOWANY<br>
            <br>
            PODAJ PIN:<br>
            <span id="pin-display">_ _ _ _</span>
        </div>
    </div>

    <div class="right-section">
        
        <div id="numpad" class="numpad">
            <button class="btn-physical" onclick="pressKey('1')">1</button>
            <button class="btn-physical" onclick="pressKey('2')">2</button>
            <button class="btn-physical" onclick="pressKey('3')">3</button>
            <button class="btn-physical" onclick="pressKey('4')">4</button>
            <button class="btn-physical" onclick="pressKey('5')">5</button>
            <button class="btn-physical" onclick="pressKey('6')">6</button>
            <button class="btn-physical" onclick="pressKey('7')">7</button>
            <button class="btn-physical" onclick="pressKey('8')">8</button>
            <button class="btn-physical" onclick="pressKey('9')">9</button>
            <button class="btn-physical btn-clear" onclick="clearPin()">C</button>
            <button class="btn-physical" onclick="pressKey('0')">0</button>
            <button class="btn-physical btn-enter" onclick="submitPin()">OK</button>
        </div>

        <div id="action-panel" class="action-panel">
            <button class="btn-physical btn-alarm btn-fire" onclick="triggerAlarm('POZAR')">
                POŻAR
            </button>
            <button class="btn-physical btn-alarm btn-intruder" onclick="triggerAlarm('WLAMANIE')">
                WŁAMANIE
            </button>
            <button class="btn-physical btn-logout" onclick="logout()">
                ZABLOKUJ PANEL
            </button>
        </div>

    </div>

</div>

<script>
    let currentPin = '';
    const correctPin = '4556';
    
    const lcd = document.getElementById('lcd');
    const pinDisplay = document.getElementById('pin-display');
    const numpad = document.getElementById('numpad');
    const actionPanel = document.getElementById('action-panel');

    // Aktualizacja znaków na ekranie LCD
    function updateDisplay() {
        let dispText = '';
        for(let i=0; i<4; i++) {
            if(i < currentPin.length) dispText += '* ';
            else dispText += '_ ';
        }
        pinDisplay.innerText = dispText.trim();
    }

    // Wprowadzanie cyfr
    function pressKey(num) {
        if (currentPin.length < 4) {
            currentPin += num;
            updateDisplay();
        }
    }

    // Czyszczenie PINu
    function clearPin() {
        currentPin = '';
        updateDisplay();
    }

    // Zatwierdzanie PINu fizycznym przyciskiem OK
    function submitPin() {
        if (currentPin === correctPin) {
            lcd.innerHTML = "AUTORYZACJA OK<br><br>SYSTEM ROZBROJONY<br>WYBIERZ AKCJE...";
            numpad.style.display = 'none';
            actionPanel.style.display = 'flex';
            lcd.classList.remove('flashing');
        } else {
            lcd.innerHTML = "BŁĄD AUTORYZACJI<br>NIEPOPRAWNY PIN<br><br>PODAJ PIN:<br><span id='pin-display'></span>";
            currentPin = '';
            // Ponowne podpięcie elementu wyświetlacza pinu po przepisaniu HTMLa ekranu
            document.getElementById('pin-display').innerText = '_ _ _ _';
        }
    }

    // Aktywacja wybranego alarmu
    function triggerAlarm(type) {
        numpad.style.display = 'none';
        actionPanel.style.display = 'none'; // Ukrywamy przyciski, by nikt nie odwołał
        lcd.classList.add('flashing'); // Efekt migania ekranu
        
        if(type === 'POZAR') {
            lcd.innerHTML = "!!! ALARM !!!<br>ZAGROŻENIE POŻAROWE<br><br>EWAKUACJA<br>STRAŻ W DRODZE";
        } else if (type === 'WLAMANIE') {
            lcd.innerHTML = "!!! ALARM !!!<br>NARUSZENIE STREFY<br><br>GRUPA INTERWENCYJNA<br>POWIADOMIONA";
        }

        // Przycisk awaryjnego resetu pojawia się po 5 sekundach (symulacja deaktywacji)
        setTimeout(() => {
            lcd.innerHTML += "<br><br><button onclick='logout()' style='padding:10px; font-weight:bold; cursor:pointer;'>RESET SYSTEMU</button>";
        }, 5000);
    }

    // Wylogowanie / Powrót do ekranu startowego
    function logout() {
        currentPin = '';
        lcd.classList.remove('flashing');
        lcd.innerHTML = "SYSTEM ZABLOKOWANY<br><br>PODAJ PIN:<br><span id='pin-display'>_ _ _ _</span>";
        actionPanel.style.display = 'none';
        numpad.style.display = 'grid';
    }
</script>
</body>
</html>
